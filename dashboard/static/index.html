<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QUANT LAB — 전략 실험실</title><link rel="stylesheet" href="/app.css"><script src="/results.js" defer></script><script src="/app.js" defer></script></head><body>
<main id="overview"><header><h1>NQ 전략 검증</h1><div id="sync" class="sync">연결 중…</div><form action="/logout" method="post"><button class="logout">로그아웃</button></form></header>
<div id="connection-warning" class="notice hidden" role="status"></div>
<section class="panel summary-panel"><div class="panel-head"><h2>현재 검증 상태</h2></div><div id="research-status"></div><div id="workers"></div></section>
<section class="panel" id="experiments"><div class="panel-head"><div><h2>전략 성과 <span id="filtered-count" class="count"></span></h2><p class="subtle" id="view-description">기존 거래 기록의 합산 성과를 불러오는 중입니다.</p></div><button class="secondary" id="export">CSV 내보내기 ↓</button></div><div class="view-tabs tabs" aria-label="기록 유형"><button data-view="summary" class="selected" aria-pressed="true">전략별 합산 성과</button><button data-view="performance" aria-pressed="false">개별 실행</button><button data-view="research" aria-pressed="false">준비·데이터 점검</button></div><div class="toolbar"><div class="tabs"><button data-filter="all" class="selected">전체</button><button data-filter="running">진행 중</button><button data-filter="completed">계산 완료</button><button data-filter="deferred">판단 보류</button><button data-filter="rejected">관측 기준 미달</button><button data-filter="failed">오류</button><button data-filter="blocked">확인 필요</button></div><div class="filters"><label class="archive-toggle"><input type="checkbox" id="archive"> 이전·교체 기록 포함</label><input id="search" aria-label="전략 검색" placeholder="전략 또는 데이터 검색"><select id="symbol" aria-label="종목"><option value="">전체 종목</option><option>NQ</option><option>GC</option><option>MNQ</option><option>MGC</option></select><select id="cost" aria-label="왕복 수수료"><option value="">전체 비용</option><option value="10">왕복 $10</option><option value="5">왕복 $5</option></select><select id="sort" aria-label="정렬"><option value="updated">기본 순서</option><option value="net">순손익 높은 순</option><option value="dd">낙폭 낮은 순</option></select></div></div><div class="table-wrap"><table><thead><tr><th>전략 / 데이터</th><th>검증 단계</th><th>실행 상태 / 연구 판정</th><th>순손익</th><th>PF</th><th>청산 기준 최대낙폭</th><th>거래 수</th><th>판단 / 한계</th></tr></thead><tbody id="runs"></tbody></table></div><div class="table-footer">PF = 비용 차감 후 총이익 ÷ 총손실 절댓값. 손실 거래가 없으면 PF는 정의되지 않습니다. 서로 다른 비용·기간의 합산 결과를 더하지 않습니다.</div></section>
<details class="panel"><summary>운영 로그</summary><div id="events" class="events"></div></details><footer>백테스트·모의 연구 전용</footer></main>
<dialog id="detail"><div class="detail-top"><div><div class="eyebrow">EXPERIMENT DETAIL</div><h2 id="detail-title"></h2></div><button id="close-detail" class="secondary" aria-label="닫기">✕</button></div><div id="detail-body"></div></dialog>
</body></html>
